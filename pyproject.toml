[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moments"
version = "1.0.3"
description = "Self-hosted photo album"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "starlette>=0.39.0",  # FileResponse HTTP Range support (video seeking).
    "uvicorn[standard]>=0.24.0",
    "pillow>=10.0.0",
    "pillow-heif>=0.15.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0", 
    "httpx2>=2.13.0",  # Starlette TestClient backend (plain httpx is deprecated there).
    "mypy>=1.7.0",
    "playwright>=1.40.0",  # Browser layout checks; uses installed Chrome (channel="chrome").
]

[tool.setuptools]
package-dir = {"" = "src"}

# All subpackages (routes, services, storage, drivers), not just top-level.
[tool.setuptools.packages.find]
where = ["src"]

# Frontend + typing marker ship inside the package (Docker installs non-editable).
[tool.setuptools.package-data]
moments = ["static/**/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_no_return = true
disallow_untyped_calls = true

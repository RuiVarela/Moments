services:
  moments:
    image: ruifilipevarela/moments:latest
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Albums (read-only): each subfolder is an album.
      - ${SOURCE_DIR:?set SOURCE_DIR to your albums folder}:/source:ro
      # Extracted metadata, thumbnails, previews (persistent).
      - moments_data:/data
      # Optional: override defaults (port, sizes, num_threads).
      # - ./config.json:/app/config.json:ro
    environment:
      # Host user/group that owns /data files.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    restart: unless-stopped

volumes:
  moments_data:
